services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mable
      POSTGRES_USER: mable
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_MABLE_DB:?Set a PostgreSQL password in Coolify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mable -d mable"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: sh -c "pnpm db:migrate && exec pnpm start"
    environment:
      DATABASE_URL: postgres://mable:${SERVICE_PASSWORD_MABLE_DB:?Set a PostgreSQL password in Coolify}@db:5432/mable
      BETTER_AUTH_URL: https://mable.arminayat.dev
      BETTER_AUTH_SECRET: ${SERVICE_HEX_64_MABLE_AUTH:?Set an auth secret in Coolify}
      CREDENTIAL_ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_MABLE_CREDENTIALS:?Set a credential encryption key in Coolify}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  worker:
    build: .
    command: pnpm worker
    environment:
      DATABASE_URL: postgres://mable:${SERVICE_PASSWORD_MABLE_DB:?Set a PostgreSQL password in Coolify}@db:5432/mable
      BETTER_AUTH_URL: https://mable.arminayat.dev
      BETTER_AUTH_SECRET: ${SERVICE_HEX_64_MABLE_AUTH:?Set an auth secret in Coolify}
      CREDENTIAL_ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_MABLE_CREDENTIALS:?Set a credential encryption key in Coolify}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
